services:
  nginx:
    image: nginx:alpine
    container_name: reverse-proxy
    restart: always
    ports: 
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-conf/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./html:/usr/share/nginx/html:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - xray
    networks:
      - vpn-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  xray:
    image: teddysun/xray:latest
    container_name: xray-core
    restart: always
    volumes:
      - ./xray-conf/config.json:/etc/xray/config.json:ro
    networks:
      - vpn-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

networks:
  vpn-net:
    driver: bridge
